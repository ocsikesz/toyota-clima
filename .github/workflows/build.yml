name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set +e
          gradle assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            errs=$(grep -E "^e: |error:|What went wrong|^> " -A4 build.log | head -60)
            errs="${errs//'%'/'%25'}"
            errs="${errs//$'\n'/'%0A'}"
            echo "::error title=Build failed::${errs}"
          fi
          exit $status

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk toyota-clima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: toyota-clima-apk
          path: toyota-clima.apk

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest toyota-clima.apk \
            --title "Toyota Clima build ${{ github.run_number }}" \
            --notes "Build automat din ${{ github.sha }}"
